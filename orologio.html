                content: {

                    en: `<div class="text-center">

            privacy: {
                id: 'privacy', icon: 'fa-user-shield',
                title: { it: "Privacy", en: "Privacy" },
                intro: { it: "Informativa (Art. 13 GDPR)", en: "Privacy Policy (GDPR)" },
                content: {
                    it: `<div class="text-sm space-y-3">
                         <p><strong>Gentile Ospite</strong>, ai sensi della normativa vigente, la informiamo che:</p>
                         <p>• <strong>Finalità</strong>: I suoi dati personali sono raccolti esclusivamente per l'adempimento degli obblighi di legge e per la gestione amministrativa del soggiorno (ricevuta).</p>
                         <p>• <strong>Conservazione</strong>: I dati identificativi saranno conservati per il tempo strettamente necessario agli obblighi fiscali (10 anni per le ricevute) e di pubblica sicurezza.</p>

                    en: `<div class="text-sm space-y-3">
                         <p><strong>Dear Guest</strong>, in accordance with current regulations (GDPR):</p>

                         <p>• <strong>Storage</strong>: Identification data will be stored for the time strictly required by fiscal obligations (10 years for receipts) and public security.</p>
                         <p>• <strong>Rights</strong>: You have the right to request access, rectification, or deletion of data (within legal limits).</p>
                         <p>• <strong>Data Controller</strong>: La Casa dell'Orologio Sorrento - Corso Italia 154, Sorrento (NA) - VAT: 08164481213.</p>

                }

        };

        let currentLang = 'it';
        let isMusicPlaying = false;
        let isTransitioning = false;

        function initApp() {
            renderDashboard();
            updateUIText();
            
            // Gestione Volume Musica (0.0 a 1.0)
            const audio = document.getElementById('bg-music');
            audio.volume = 0.2; // Impostato al 20% per sottofondo gradevole

            document.getElementById('lang-toggle').onclick = () => {
                currentLang = currentLang === 'it' ? 'en' : 'it';
                updateUIText();
                renderDashboard();
                if(!document.getElementById('detail-view').classList.contains('hidden-view')) {
                    openDetail(document.getElementById('detail-view').dataset.activeId);
                }
            };

            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');

            const playAudio = async () => {
                if (isTransitioning || isMusicPlaying) return;
                isTransitioning = true;
                try {
                    if (audio.readyState === 0) audio.load();
                    await audio.play();
                    musicIcon.className = "fas fa-volume-up text-amber-800";
                    musicToggle.classList.add('music-active');
                    isMusicPlaying = true;
                } catch (e) { console.log("Autoplay bloccato."); }
                finally { isTransitioning = false; }
            };

            musicToggle.onclick = async () => {
                if (isTransitioning) return;
                if (isMusicPlaying) {
                    audio.pause();
                    musicIcon.className = "fas fa-music text-stone-900";
                    musicToggle.classList.remove('music-active');
                    isMusicPlaying = false;
                } else { playAudio(); }
            };

            document.addEventListener('click', playAudio, { once: true });
            document.addEventListener('touchstart', playAudio, { once: true });
            document.getElementById('back-btn').onclick = closeDetail;
        }

        function renderDashboard() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            // Escludiamo reviews e privacy dalla griglia principale per tenerli in fondo come bottoni speciali
            const specialIds = ['reviews', 'privacy'];
            Object.values(appData).filter(item => !specialIds.includes(item.id)).forEach(item => {
                const card = document.createElement('button');
                card.className = "menu-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 shadow-sm";
                card.onclick = () => openDetail(item.id);
                card.innerHTML = `
                    <div class="text-amber-800 text-xl"><i class="fas ${item.icon}"></i></div>
                    <span class="text-[10px] font-black uppercase tracking-tighter text-stone-900 text-center leading-none">${item.title[currentLang]}</span>
                `;
                grid.appendChild(card);
            });
        }

        function updateUIText() {
            document.getElementById('lang-text').textContent = currentLang === 'it' ? "ENGLISH" : "ITALIANO";
            document.getElementById('ui-back').textContent = currentLang === 'it' ? "Indietro" : "Back";
            document.getElementById('review-btn-text').textContent = currentLang === 'it' ? "Recensioni" : "Reviews";
            document.getElementById('privacy-btn-text').textContent = currentLang === 'it' ? "Privacy" : "Privacy";
        }

        function openDetail(id) {
            const data = appData[id];
            const detailView = document.getElementById('detail-view');
            detailView.dataset.activeId = id;
            document.getElementById('detail-title').textContent = data.title[currentLang];
            document.getElementById('detail-icon').innerHTML = `<i class="fas ${data.icon}"></i>`;
            document.getElementById('section-intro').textContent = data.intro[currentLang];
            document.getElementById('detail-content').innerHTML = data.content[currentLang];
            const mapContainer = document.getElementById('map-container');
            if(data.hasMap) mapContainer.classList.remove('hidden');
            else mapContainer.classList.add('hidden');
            const qr = document.getElementById('qr-container');
            if(data.hasQR) qr.classList.remove('hidden');
            else qr.classList.add('hidden');
            document.getElementById('dashboard-view').classList.add('hidden-view');
            detailView.classList.remove('hidden-view');
            detailView.classList.add('active-view');
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('active-view');
            document.getElementById('detail-view').classList.add('hidden-view');
            document.getElementById('dashboard-view').classList.remove('hidden-view');
            document.getElementById('dashboard-view').classList.add('active-view');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
